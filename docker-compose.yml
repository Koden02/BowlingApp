services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8080
    depends_on:
      - api