services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8081:8080" # optional (useful for hitting API directly)

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.prod
    ports:
      - "8080:80"   # the website will be on http://localhost:8080
    depends_on:
      - api